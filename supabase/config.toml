project_id = "handover-marketplace"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "{{ .Token }} is your Handover sign-in code"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.email_change]
subject = "Confirm your Handover email change"
content_path = "./supabase/templates/email-change.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your Handover email address was changed"
content_path = "./templates/email-changed-notification.html"

[storage]
enabled = true
file_size_limit = "10MiB"

[analytics]
enabled = false
